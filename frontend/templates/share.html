<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحليل مشترك · Gold Nightmare</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cairo:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo-link">
        <span class="logo-mark">🌙</span>
        <div>
          <p class="logo-title display-font">Gold Nightmare</p>
          <p class="logo-sub">Shared Analysis</p>
        </div>
      </a>
    </div>
  </header>

  <main>
    <div class="container" style="padding:32px 20px;max-width:1100px;margin:0 auto;">
      <div id="share-content">
        <div class="text-center" style="padding:60px;"><div class="spin"></div></div>
      </div>
    </div>
  </main>

  <script src="/static/js/render.js"></script>
  <script>
    const TOKEN = "{{ token }}";
    fetch(`/share/${TOKEN}/data`, { credentials: 'omit' })
      .then(r => {
        if (!r.ok) throw new Error('الرابط غير صالح أو منتهي');
        return r.json();
      })
      .then(d => {
        const el = document.getElementById('share-content');
        const meta = `
          <div class="text-center mb-5">
            <p class="muted" style="font-size:13px;">📊 ${d.symbol} · ${d.timeframe} · ${new Date(d.created_at).toLocaleDateString('ar-EG')}</p>
            <h1 class="display-font text-gradient-gold" style="font-size:32px;">تحليل مشترك</h1>
            <div class="ornament"></div>
          </div>`;
        el.innerHTML = meta + Render.analysis(d.result_json || {});
      })
      .catch(e => {
        document.getElementById('share-content').innerHTML =
          `<div class="text-center" style="padding:60px;"><p class="error-msg">${e.message}</p></div>`;
      });
  </script>
</body>
</html>
