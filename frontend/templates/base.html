<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>{% block title %}{{ settings.APP_NAME }}{% endblock %}</title>

  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cairo:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo-link">
        <span class="logo-mark">🌙</span>
        <div>
          <p class="logo-title display-font">Gold Nightmare</p>
          <p class="logo-sub">Personal Edition</p>
        </div>
      </a>

      <nav class="main-nav">
        <a href="/" class="nav-link" data-i18n="nav_analyze">🎯 تحليل</a>
        <a href="/history" class="nav-link" data-i18n="nav_history">📋 السجل</a>
        <a href="/dashboard" class="nav-link" data-i18n="nav_dashboard">📊 الإحصائيات</a>
        <a href="/training" class="nav-link" data-i18n="nav_training">🧠 التدريب</a>
        <button class="btn-ghost" id="logout-btn" style="font-size:13px;" data-i18n="logout">خروج</button>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="ornament"></div>
    <p class="text-muted text-center" style="font-size:12px;">
      <span class="display-font gold">{{ settings.APP_NAME }}</span> · v{{ settings.APP_VERSION }}
    </p>
  </footer>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/render.js"></script>
  {% block scripts %}{% endblock %}

  <script>
    // Wire logout
    const lb = document.getElementById('logout-btn');
    if (lb) lb.addEventListener('click', () => Auth.logout());

    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/static/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
