version: '3.9'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gn-vision-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://gnuser:gnpass@db:5432/gn_vision
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../alembic:/app/alembic:ro

  db:
    image: postgres:16-alpine
    container_name: gn-vision-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gnuser
      POSTGRES_PASSWORD: gnpass
      POSTGRES_DB: gn_vision
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnuser -d gn_vision"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: gn-vision-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    container_name: gn-vision-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    profiles: ["with-nginx"]

volumes:
  postgres_data:
  redis_data:
